<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070c18">
  <title>無名旅人的星光之路</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <!-- 桌機時舞台兩側的模糊背景 -->
  <div class="backdrop" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="scene-bg" id="scene-bg"></div>
    <img class="sprite" id="sprite" alt="" hidden>
    <div class="tap-layer" id="scene" aria-hidden="true"></div>

    <header class="hud">
      <div class="hud-place">
        <small id="chapter"></small>
        <strong><span aria-hidden="true">✦</span> <span id="location"></span></strong>
      </div>
      <div class="hud-actions">
        <button class="hud-button" id="journal-open" aria-label="旅人的手札">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5v13"/></svg>手札</button>
        <button class="hud-button" id="menu-open" aria-label="選單">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>選單</button>
      </div>
    </header>

    <section class="choices" id="choices" aria-label="選項"></section>

    <section class="dialogue-wrap">
      <div class="dialogue" id="dialogue" role="button" tabindex="0" aria-label="下一句">
        <div class="speaker" id="speaker" hidden></div>
        <p class="line" id="line" aria-live="polite"></p>
        <span class="next-mark" id="next-mark" aria-hidden="true">▼</span>
      </div>
      <div class="vn-controls">
        <span class="progress" id="progress"></span>
        <button class="text-button" id="log-open">紀錄</button>
        <button class="text-button" id="auto" aria-pressed="false">自動</button>
        <button class="text-button" id="skip">快轉 ≫</button>
      </div>
    </section>

    <div class="chapter-card" id="chapter-card" hidden>
      <small id="card-chapter"></small>
      <h1 id="title"></h1>
      <span aria-hidden="true">✦</span>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>

  <dialog id="journal" class="card journal">
    <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i>
    <i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>
    <button class="card-close" data-close aria-label="關閉">✕</button>
    <header class="journal-head">
      <small>Traveler's Journal</small>
      <h2>旅人的手札</h2>
    </header>
    <section class="journal-section">
      <h3>信任 <span id="trust"></span></h3>
      <div class="trust-lamps" id="trust-lamps" aria-hidden="true"></div>
      <p class="journal-note">你與這片土地建立的連結</p>
    </section>
    <section class="journal-section">
      <h3>旅途行囊 <span id="item-count"></span></h3>
      <ul id="inventory" class="inventory"></ul>
    </section>
  </dialog>

  <dialog id="menu" class="card menu">
    <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i>
    <i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>
    <button class="card-close" data-close aria-label="關閉">✕</button>
    <header class="menu-head">
      <small>Menu</small>
      <h2>選單</h2>
    </header>
    <div class="menu-list">
      <button class="menu-item" id="fullscreen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>全螢幕</button>
      <a class="menu-item" href="../">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l-6 6 6 6M4 12h16"/></svg>返回作品集</a>
      <hr class="menu-rule">
      <button class="menu-item danger" id="restart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>重新開始</button>
    </div>
    <p class="menu-note">點擊畫面或按空白鍵繼續<br>旅程會自動保存在此瀏覽器</p>
  </dialog>

  <dialog id="log" class="sheet log">
    <div class="sheet-head">
      <div><small>BACKLOG</small><h2>對白紀錄</h2></div>
      <button class="text-button" data-close>關閉 ✕</button>
    </div>
    <ol id="log-list"></ol>
  </dialog>

  <script src="story.js"></script>
  <script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070c18">
  <title>無名旅人的星光之路</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <!-- 桌機時舞台兩側的模糊背景 -->
  <div class="backdrop" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="scene-bg" id="scene-bg"></div>
    <img class="sprite" id="sprite" alt="" hidden>
    <div class="tap-layer" id="scene" aria-hidden="true"></div>

    <header class="hud">
      <div class="hud-place">
        <small id="chapter"></small>
        <strong><span aria-hidden="true">✦</span> <span id="location"></span></strong>
      </div>
      <div class="hud-actions">
        <button class="hud-button" id="journal-open" aria-label="旅人的手札"><i aria-hidden="true">◇</i>手札</button>
        <button class="hud-button" id="menu-open" aria-label="選單"><i aria-hidden="true">☰</i>選單</button>
      </div>
    </header>

    <section class="choices" id="choices" aria-label="選項"></section>

    <section class="dialogue-wrap">
      <div class="dialogue" id="dialogue" role="button" tabindex="0" aria-label="下一句">
        <div class="speaker" id="speaker" hidden></div>
        <p class="line" id="line" aria-live="polite"></p>
        <span class="next-mark" id="next-mark" aria-hidden="true">▼</span>
      </div>
      <div class="vn-controls">
        <span class="progress" id="progress"></span>
        <button class="text-button" id="log-open">紀錄</button>
        <button class="text-button" id="auto" aria-pressed="false">自動</button>
        <button class="text-button" id="skip">快轉 ≫</button>
      </div>
    </section>

    <div class="chapter-card" id="chapter-card" hidden>
      <small id="card-chapter"></small>
      <h1 id="title"></h1>
      <span aria-hidden="true">✦</span>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>

  <dialog id="journal" class="sheet">
    <div class="sheet-head">
      <div><small>TRAVELER'S JOURNAL</small><h2>旅人的手札</h2></div>
      <button class="text-button" data-close>關閉 ✕</button>
    </div>
    <div class="sheet-body">
      <p class="stat-label">✧ 信任 <span id="trust"></span></p>
      <div class="meter"><i id="meter"></i></div>
      <p class="hint">你與這片土地建立的連結</p>
      <p class="stat-label">◇ 旅途行囊</p>
      <ul id="inventory" class="inventory"></ul>
    </div>
  </dialog>

  <dialog id="menu" class="sheet">
    <div class="sheet-head">
      <div><small>MENU</small><h2>選單</h2></div>
      <button class="text-button" data-close>關閉 ✕</button>
    </div>
    <div class="sheet-body menu-list">
      <button class="menu-item" id="fullscreen" hidden>全螢幕 ⛶</button>
      <button class="menu-item" id="restart">重新開始 ↺</button>
      <a class="menu-item" href="../">返回作品集 ↗</a>
      <p class="hint">點擊畫面或按空白鍵繼續。旅程會自動保存在此瀏覽器。</p>
    </div>
  </dialog>

  <dialog id="log" class="sheet log">
    <div class="sheet-head">
      <div><small>BACKLOG</small><h2>對白紀錄</h2></div>
      <button class="text-button" data-close>關閉 ✕</button>
    </div>
    <ol id="log-list"></ol>
  </dialog>

  <script src="story.js"></script>
  <script src="game.js"></script>
</body>
</html>
